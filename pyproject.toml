[project]
name = "questudy-backend"
version = "0.1.0"
description = "Questudy local backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
